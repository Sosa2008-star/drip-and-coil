services:
  - type: web
    name: drip-and-coil
    env: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/products
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_ADMIN
        value: s88xy
    disk:
      name: drip-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
